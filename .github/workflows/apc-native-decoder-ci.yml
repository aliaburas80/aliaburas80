name: APC Native macOS 26 Safety CI

on:
  push:
    branches: [apc-native-decoder-ci]
  workflow_dispatch:

jobs:
  native-safety-stress:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Swift versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
      - name: Verify Swift 6 is available
        run: xcrun swiftc -swift-version 6 -version
      - name: Compile exact v1.1 isolated decoder source
        run: |
          mkdir -p .build
          xcrun swiftc -O -swift-version 6 \
            apc-decoder-exact/ImageDownsampler.swift \
            apc-decoder-exact/main.swift \
            -framework ImageIO -framework CoreGraphics \
            -o .build/apc-decoder-exact
      - name: Run exact v1.1 decoder self-test
        run: |
          set -euo pipefail
          ./.build/apc-decoder-exact --runtime-self-test
      - name: Stress ten fresh decoder parents (100 large decodes total)
        run: |
          set -euo pipefail
          for batch in {1..10}; do
            echo "decoder batch $batch/10"
            ./.build/apc-decoder-exact --runtime-self-test
          done
      - name: Measure exact decoder memory footprint
        run: |
          set -euo pipefail
          /usr/bin/time -l ./.build/apc-decoder-exact --runtime-self-test 2> exact-memory.txt
          cat exact-memory.txt
      - name: Compile 85MP high-entropy JPEG generator
        run: |
          xcrun swiftc -O -swift-version 6 \
            apc-large-ci/make_large.swift \
            -framework ImageIO -framework CoreGraphics \
            -o .build/make-large
      - name: Generate 10667x8000 stress JPEG
        run: |
          set -euo pipefail
          /usr/bin/time -l ./.build/make-large "$RUNNER_TEMP/apc-85mp.jpg" 2> generator-memory.txt | tee giant-image.txt
          ls -lh "$RUNNER_TEMP/apc-85mp.jpg"
          cat generator-memory.txt
      - name: Decode 85MP stress JPEG through exact child helper
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            rm -f "$RUNNER_TEMP/giant-$pass.apcrgba"
            /usr/bin/time -l ./.build/apc-decoder-exact \
              --decode-helper \
              --input "$RUNNER_TEMP/apc-85mp.jpg" \
              --output "$RUNNER_TEMP/giant-$pass.apcrgba" \
              --max 1800 2> "giant-decode-$pass-memory.txt"
            python3 - "$RUNNER_TEMP/giant-$pass.apcrgba" <<'PY'
import struct, sys
p=sys.argv[1]
with open(p,'rb') as f:
    head=f.read(16)
if len(head)!=16 or head[:4]!=b'APCR':
    raise SystemExit('invalid APCR header')
w,h,row=struct.unpack('<III',head[4:16])
if max(w,h)>1800 or row != w*4:
    raise SystemExit(f'invalid bounded dimensions: {w}x{h}, row={row}')
print(f'85MP decode bounded successfully: {w}x{h}')
PY
            cat "giant-decode-$pass-memory.txt"
          done
      - name: Compile Apple Vision safety-profile stress harness
        run: |
          xcrun swiftc -O -swift-version 6 \
            apc-vision-ci/main.swift \
            -framework Vision -framework CoreGraphics \
            -o .build/apc-vision-stress
      - name: Stress Apple Vision classification, saliency, and faces
        run: |
          set -euo pipefail
          /usr/bin/time -l ./.build/apc-vision-stress 2> vision-memory.txt
          cat vision-memory.txt
      - name: Upload native safety diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apc-v1.1-macos26-native-safety-diagnostics
          path: |
            exact-memory.txt
            generator-memory.txt
            giant-image.txt
            giant-decode-*-memory.txt
            vision-memory.txt
          if-no-files-found: ignore
